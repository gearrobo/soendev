services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soendev-app
    restart: unless-stopped
    working_dir: /var/www/html

    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor

    depends_on:
      db:
        condition: service_healthy

    networks:
      - soendev

  nginx:
    image: nginx:alpine
    container_name: soendev-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html:ro
      - vendor:/var/www/html/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - soendev

  db:
    image: mariadb:10.6
    container_name: soendev-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: dcim
      MYSQL_USER: soendev
      MYSQL_PASSWORD: soendev_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password

    volumes:
      - dbdata:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - soendev

  node:
    image: node:22-alpine
    container_name: soendev-node
    working_dir: /var/www/html

    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    ports:
      - "5173:5173"

    networks:
      - soendev

volumes:
  vendor:
  node_modules:
  dbdata:

networks:
  soendev:
    driver: bridge